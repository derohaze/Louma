services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in Coolify}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in Coolify}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://app.loumapay.com}
      HOST: ${HOST:-0.0.0.0}
      IPINFO_TIMEOUT_MS: ${IPINFO_TIMEOUT_MS:-2500}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      LMDG_AMBIGUOUS_MATCH_THRESHOLD: ${LMDG_AMBIGUOUS_MATCH_THRESHOLD:-55}
      LMDG_BROWSER_KEY_REQUIRED: ${LMDG_BROWSER_KEY_REQUIRED:-false}
      LMDG_CHALLENGE_TTL_SECONDS: ${LMDG_CHALLENGE_TTL_SECONDS:-300}
      LMDG_DEVICE_LEASE_ENABLED: ${LMDG_DEVICE_LEASE_ENABLED:-true}
      LMDG_DEVICE_OBSERVATION_TTL_SECONDS: ${LMDG_DEVICE_OBSERVATION_TTL_SECONDS:-7776000}
      LMDG_ENABLED: ${LMDG_ENABLED:-true}
      LMDG_HIGH_CONFIDENCE_MATCH_THRESHOLD: ${LMDG_HIGH_CONFIDENCE_MATCH_THRESHOLD:-78}
      LMDG_IP_INTELLIGENCE_TTL_SECONDS: ${LMDG_IP_INTELLIGENCE_TTL_SECONDS:-86400}
      LMDG_NONCE_TTL_SECONDS: ${LMDG_NONCE_TTL_SECONDS:-300}
      LMDG_RISK_MODE: ${LMDG_RISK_MODE:-enforce}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOUMA_API_PORT: ${LOUMA_API_PORT:-8000}
      MINING_CYCLE_DURATION_SECONDS: ${MINING_CYCLE_DURATION_SECONDS:-86400}
      MINING_ENABLED: ${MINING_ENABLED:-true}
      MINING_MAX_ACTIVE_CYCLES_PER_USER: ${MINING_MAX_ACTIVE_CYCLES_PER_USER:-1}
      MINING_RATE_DECIMALS: ${MINING_RATE_DECIMALS:-6}
      MINING_RATE_MAX_LMA_PER_HOUR: ${MINING_RATE_MAX_LMA_PER_HOUR:-0.0500}
      MINING_RATE_MIN_LMA_PER_HOUR: ${MINING_RATE_MIN_LMA_PER_HOUR:-0.0100}
      MINING_SETTLEMENT_ENABLED: ${MINING_SETTLEMENT_ENABLED:-true}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS:-5000}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-louma}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in Coolify}
      NODE_ENV: ${NODE_ENV:-production}
      PROXYCHECK_HMAC_KEY: ${PROXYCHECK_HMAC_KEY:-}
      PROXYCHECK_KEY: ${PROXYCHECK_KEY:-}
      PROXYCHECK_TIMEOUT_MS: ${PROXYCHECK_TIMEOUT_MS:-2500}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-louma_production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in Coolify}
      RETENTION_TTL_ENABLED: ${RETENTION_TTL_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY in Coolify}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:?Set GATEWAY_API_KEY_PEPPER in Coolify}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?Set GATEWAY_ENCRYPTION_KEY in Coolify}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:?Set GATEWAY_SERVICE_KEY in Coolify}
      GATEWAY_FEE_BASIS_POINTS: ${GATEWAY_FEE_BASIS_POINTS:-100}
      GATEWAY_FEE_VERSION: ${GATEWAY_FEE_VERSION:-2026-10-08}
      GATEWAY_CREATION_PAUSED: ${GATEWAY_CREATION_PAUSED:-false}
      GATEWAY_SETTLEMENT_PAUSED: ${GATEWAY_SETTLEMENT_PAUSED:-false}
      GATEWAY_BILLING_PAUSED: ${GATEWAY_BILLING_PAUSED:-false}
      GATEWAY_MERCHANT_PAUSED: ${GATEWAY_MERCHANT_PAUSED:-false}
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-true}
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-live}
      GATEWAY_LIVE_ENABLED: ${GATEWAY_LIVE_ENABLED:-false}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-https://checkout.loumapay.com}
      GATEWAY_DASHBOARD_URL: ${GATEWAY_DASHBOARD_URL:-https://app.loumapay.com}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-64}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 45s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    networks:
      - coolify
networks:
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
