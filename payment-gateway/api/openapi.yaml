openapi: 3.1.1
info:
  title: Louma Payments API
  version: 1.0.0
  description: One environment per process. Merchant keys create consent checkouts;
    payer confirmation is an internal session-bound operation. Money inputs and payment
    views are decimal strings; catalog/billing/refund views expose exact integer amount_minor.
    Requests are limited to 64 KiB. SDKs never retry automatically.
servers:
- url: http://127.0.0.1:8090
  description: Local test process; override with your configured gateway URL.
