webhooks:
  gatewayEvent:
    post:
      summary: At-least-once gateway event
      parameters:
      - name: Louma-Signature
        in: header
        required: true
        schema: *id001
        description: t=seconds,v1=hex HMAC-SHA256(secret, timestamp + '.' + raw request
          body). Reject older than 300 seconds or more than 30 seconds in the future.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event durably accepted. Dedupe by event id; verify authoritative
            payment before fulfillment.
        '400':
          description: Invalid signature or malformed event.
        '503':
          description: Not accepted; eligible for bounded retry.
