components:
  securitySchemes:
    MerchantKey:
      type: http
      scheme: bearer
      bearerFormat: lma_test_... or lma_live_...
    InternalSignature:
      type: apiKey
      in: header
      name: X-Louma-Signature
      description: HMAC-SHA256 of timestamp, nonce, method, request URI, authenticated
        owner UUID, and SHA256(raw body), joined with newline. Trusted Node service
        only; 60-second past/30-second future window and durable nonce replay rejection.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            request_id: *id002
          required:
          - code
          - message
          - request_id
          additionalProperties: true
      required:
      - error
      additionalProperties: true
    Money: &id004
      type: string
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{4}$
    Metadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 240
    CheckoutInput:
      type: object
      properties:
        subtotal: &id003
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,4})?$
        tax: *id003
        currency:
          const: LMA
        description:
          type: string
          maxLength: 240
        success_url:
          type: string
          maxLength: 2048
        cancel_url:
          type: string
          maxLength: 2048
        price_id: *id002
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - currency
      additionalProperties: false
    Payment:
      type: object
      properties:
        id: *id002
        payment_id: *id002
        application_id: *id002
        intent_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          enum:
          - requires_action
          - succeeded
          - canceled
          - failed
        currency:
          const: LMA
        subtotal: *id004
        tax: *id004
        total: *id004
        fee: *id004
        merchant_net: *id004
        fee_policy:
          type: object
          properties:
            version: *id001
            basis_points:
